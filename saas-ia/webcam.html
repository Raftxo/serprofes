<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas webcam con iframe</title>
</head>
<body>
    <iframe 
  src="https://krupowki.webcamera.pl/" 
  style="border:2;width: 800px;height: 800px;"
  allow="autoplay">
</iframe>

<div id="player" style="width:100%;height:50%;"></div>
<script src="https://webcamera.pl/player/player.js"></script>
<script>
  webcamera_player("player", {
    id: "krupowki",
    autoplay: true,
    muted: true,
    controls: false
  });
</script>

</body>
</html>
