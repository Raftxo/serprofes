<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi IA SaaS - Panel de Control</title>
    <link rel="stylesheet" href="style.css">
    <!-- enlacamos con el fichero app.js DEFER para que cargue junto¿? al html -->
    <script src="app.js" defer></script>
</head>


<body bgcolor="pink">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area">
                <h2>IA Master</h2>
            </div>
            <nav class="menu-lateral">
                <button>+ Nuevo Chat</button>
                <div class="historial">
                    <p>Historial reciente</p>
                    <ul>
                        <li>¿Cómo hacer dieta?</li>
                        <li>Receta de pizza</li>
                    </ul>
                </div>
            </nav>
            <div class="perfil">
                <span>Usuario Pro</span>
            </div>
        </aside>

        <main class="chat-area">

            <header class="chat-header">
                <h3>Conversación Actual</h3>
            </header>

            <!-- AGREGAR BOTONES 14/05/2026 -->
            <div class="controles-filtros">
                <button onclick="mostrarTodo()">Ver Todo</button>
                <button onclick="verMisMensajes()">Mis Mensajes</button>
                <button onclick="modoGritar()">Modo Mayúsculas</button>
            </div>

            <section class="mensajes-container" id="caja-mensajes">
                <!-- <div class="mensaje-ia">¡Hola! ¿En qué puedo ayudarte hoy?</div> -->
            </section>

            <footer class="input-area">
                <!-- evento form onsubmit añadimos la función enviarPrompt() -->
                <form class="chat-form" onsubmit="enviarPrompt(event)">
                     <!-- añadir un label for= que conecta con "mensaje-input" -->
                     <!-- sr-only significa solo para lectores de pantalla (screen readers) -->
                     <label for="mensaje-input" class="sr-only">Mensaje</label>
                    <!-- Añadimos un id para que desde javascript lo podamos usar -->
                    <input 
                        type="text" 
                        id="mensaje-input" 
                        placeholder="Escribe tu pregunta aquí ..."
                        autocomplete="off"
                    >
                    <!-- Añadir tipo submit -->
                    <button type="submit">Enviar</button>
                </form>
            </footer>
        </main>
    </div>

</body>
</html>
