<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="card">
        <h2>🩺 Tu Nutricionista Virtual 🩺</h1>
            <br>
            <label>Peso (kg): </label>
            <input type="number" id="input-peso" step="1" placeholder="Ej: 75">

            <label>Altura (m): </label>
            <input type="number" step="0.01" id="input-altura" placeholder="Ej: 1.75">

            <br>
            <button onclick="calcularIMC()">Diagnóstico</button>

            <br><br>
            <p class="resultado" id="mensaje-salida">Esperando datos...</p>
    </div>
    
</body>
</html>
