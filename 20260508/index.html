<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade: Adivina el Número</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="card">
        <h2>🎯 Adivina el Número 🎯</h2>
        <p class="instrucciones">
            Estoy pensando en un número del 1 al 10...<br>
        </p>
        <!-- mostrar vidas dinámicamente (js) -->
        <h3 id="texto-vidas">Vidas 3 ❤️</h3>
        <!-- campo donde el usuario escribe el número -->
        <input type="number" id="input-numero" placeholder="número entre 1 y 10" min="1" max="10" step="1">
        <button id="btn-jugar" onclick="comprobarNumero()">
            Probar Suerte
        </button>
        <!-- aquí pondremos los mensajes del juego -->
        <p class="resultado" id="mensaje-salida">
            ¡Haz tu primer intento!
        </p>
    
    </div>
    
</body>
</html>
